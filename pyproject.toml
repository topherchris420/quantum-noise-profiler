[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-noise-profiler"
version = "0.1.0.dev0"
description = "Provenance-aware qubit noise tracking and drift detection for Qiskit and Cirq"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.14"]
cirq = ["cirq-core>=1.3"]
experiments = ["qiskit-experiments>=0.6"]
dev = ["pytest>=8", "quantum-noise-profiler[qiskit,cirq,experiments]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Duration is rounded:UserWarning", "ignore:Providing `coupling_map`:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/qnp/legacy/v01_drift.py"]  # frozen v0.1 copy, kept byte-identical

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
ignore = ["E731", "B008", "B023", "RUF012", "RUF015", "UP007", "B905"]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E402", "E501"]
"tests/*" = ["E702", "E703"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true
files = ["src/qnp"]
exclude = ["src/qnp/legacy/"]
