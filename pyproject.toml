[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-noise-profiler"
version = "0.1.0.dev0"
description = "Provenance-aware qubit noise tracking and drift detection for Qiskit and Cirq"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.14"]
cirq = ["cirq-core>=1.3"]
experiments = ["qiskit-experiments>=0.6"]
dev = ["pytest>=8", "quantum-noise-profiler[qiskit,cirq,experiments]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Duration is rounded:UserWarning", "ignore:Providing `coupling_map`:UserWarning"]
